# Starship — Kanagawa Pills aérées (livepixelz)
# Pilules arrondies espacées, style "badges Linear"

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$time\
$line_break\
$character"""

# Palette Kanagawa (hex explicite — bg:palette nommée buggé en 1.25)
# sumiInk1     = #1f1f28
# fujiGray     = #727169
# crystalBlue  = #7e9cd8
# springBlue   = #7fb4ca
# springGreen  = #98bb6c
# autumnRed    = #e46876
# carpYellow   = #e6c384
# sakuraPink   = #d27e99
# oniViolet    = #957fb8
# surimiOrange = #ffa066
# waveAqua     = #7aa89f

[directory]
format = '[](fg:#e6c384)[ 󰉋 $path ](bg:#e6c384 fg:#1f1f28 bold)[](fg:#e6c384)  '
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = " "
"Pictures"  = " "
"code"      = " "
"projects"  = " "

[git_branch]
symbol = ""
format = '[](fg:#98bb6c)[ $symbol $branch](bg:#98bb6c fg:#1f1f28 bold)'

[git_status]
format = '[ $all_status$ahead_behind ](bg:#98bb6c fg:#1f1f28 bold)[](fg:#98bb6c)  '
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "\\$"
modified = "✗"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = ""
format = '[](fg:#7fb4ca)[ $symbol $version ](bg:#7fb4ca fg:#1f1f28 bold)[](fg:#7fb4ca)  '

[python]
symbol = ""
format = '[](fg:#d27e99)[ $symbol $version ](bg:#d27e99 fg:#1f1f28 bold)[](fg:#d27e99)  '

[rust]
symbol = ""
format = '[](fg:#ffa066)[ $symbol $version ](bg:#ffa066 fg:#1f1f28 bold)[](fg:#ffa066)  '

[golang]
symbol = ""
format = '[](fg:#7aa89f)[ $symbol $version ](bg:#7aa89f fg:#1f1f28 bold)[](fg:#7aa89f)  '

[docker_context]
symbol = ""
format = '[](fg:#957fb8)[ $symbol $context ](bg:#957fb8 fg:#1f1f28 bold)[](fg:#957fb8)  '

[time]
disabled = false
time_format = "%H:%M"
format = '[](fg:#7e9cd8)[ $time ](bg:#7e9cd8 fg:#1f1f28 bold)[](fg:#7e9cd8)'

[character]
success_symbol = "[❯](bold fg:#7e9cd8)"
error_symbol = "[❯](bold fg:#e46876)"
vimcmd_symbol = "[❮](bold fg:#98bb6c)"

[cmd_duration]
min_time = 2000
style = "fg:#727169 italic"
format = ' [took $duration]($style)'

[custom.doppler]
command = "doppler configure get config --plain 2>/dev/null"
when = "test -f .doppler.yaml"
format = '[](fg:#957fb8)[ 󰒃 $output ](bg:#957fb8 fg:#1f1f28 bold)[](fg:#957fb8)  '
description = "Active Doppler config"
